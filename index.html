<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Я удалил себя сам</title>
    <!-- Подключаем изящный шрифт Cormorant Garamond -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,300&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Cormorant Garamond', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        h1 {
            font-size: 3rem;
            font-weight: 300;
            font-style: italic;
            letter-spacing: 0.1em;
            text-align: center;
            opacity: 0;
            animation: fadeIn 2.5s ease-in-out forwards;
        }

        /* Плавное появление надписи */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 0.9;
                transform: translateY(0);
            }
        }

        /* Адаптивность для мобильных экранов */
        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
                padding: 0 20px;
            }
        }
    </style>
</head>
<body>

    <h1>я удалил себя сам</h1>

</body>
</html>
